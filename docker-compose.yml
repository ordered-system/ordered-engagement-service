services:
  engagement-mongo:
    image: mongo:7
    container_name: engagement-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: engagement_service
      MONGO_INITDB_ROOT_PASSWORD: engagement_service
      MONGO_INITDB_DATABASE: engagement_db
    ports:
      - "27018:27017"
    volumes:
      - engagement_mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/engagement_db --quiet
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  engagement_mongo_data:
